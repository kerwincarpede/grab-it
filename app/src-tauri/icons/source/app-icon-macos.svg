<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The same artwork on Apple's icon grid: an 824 px tile centred in 1024
       with a soft shadow, so it sits at the same size as other macOS icons. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="2.4" fill="#2A2E37"/>
    </pattern>
    <radialGradient id="shutter" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFE3C9"/>
      <stop offset="1" stop-color="#FF9EB8"/>
    </radialGradient>
  </defs>
  <!-- 480 px source tile scaled to 824 px: scale 824/480, origin moved so it starts at 100. -->
  <g transform="translate(100 100) scale(1.716667) translate(-16 -16)">
    <rect x="16" y="16" width="480" height="480" rx="106" fill="#16181D" filter="url(#shadow)"/>
    <rect x="16" y="16" width="480" height="480" rx="106" fill="url(#dots)"/>
    <rect x="17.5" y="17.5" width="477" height="477" rx="104.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="3"/>
    <g fill="none" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
      <path d="M108 206 V140 Q108 108 140 108 H206" stroke="#FFC9A6"/>
      <path d="M306 108 H372 Q404 108 404 140 V206" stroke="#C6B4FF"/>
      <path d="M404 306 V372 Q404 404 372 404 H306" stroke="#A6ECCB"/>
      <path d="M206 404 H140 Q108 404 108 372 V306" stroke="#9CD3FF"/>
    </g>
    <circle cx="256" cy="256" r="62" fill="url(#shutter)"/>
  </g>
</svg>
