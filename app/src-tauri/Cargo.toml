[package]
name = "grab-it"
version = "0.2.0"
description = "Grab-it: screenshot, annotate, record and search your captures"
authors = ["Kerwin Carpede"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "grab_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.42", features = ["bundled"] }
# ocrs 0.12 is the newest release on rten 0.24, whose MSRV (1.89) the
# project's toolchain meets; rten 0.25+ needs Rust 1.94. The `onnx` feature
# loads the published .onnx models (the .rten ones are no longer hosted).
ocrs = { version = "=0.12.2", default-features = false, features = ["onnx"] }
rten = { version = "0.24", default-features = false, features = ["onnx_format"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Already in the tree through ureq; encodes captures for vision models.
base64 = "0.23"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
futures-util = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[dev-dependencies]
tempfile = "3"

# ocrs is unusably slow unoptimised (see its README), so OCR crates are
# optimised in dev and test builds too.
[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package."rten-base"]
opt-level = 3

[profile.dev.package."rten-gemm"]
opt-level = 3

[profile.dev.package."rten-imageproc"]
opt-level = 3

[profile.dev.package."rten-model-file"]
opt-level = 3

[profile.dev.package."rten-onnx"]
opt-level = 3

[profile.dev.package."rten-shape-inference"]
opt-level = 3

[profile.dev.package."rten-simd"]
opt-level = 3

[profile.dev.package."rten-tensor"]
opt-level = 3

[profile.dev.package."rten-vecmath"]
opt-level = 3

# Screen recording quantises every frame to 256 colours; unoptimised, that
# cannot keep up with the frame rate.
[profile.dev.package.color_quant]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
