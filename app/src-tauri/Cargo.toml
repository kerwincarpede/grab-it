[package]
name = "grab-it"
version = "0.2.0"
description = "Grab-it: screenshot, annotate, record and search your captures"
authors = ["Kerwin Carpede"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "grab_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: the capture overlay is a see-through window.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
xcap = "0.7"
image = { version = "0.25", default-features = false, features = ["png", "gif"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.42", features = ["bundled"] }
# ocrs 0.12 is the newest release on rten 0.24, whose MSRV (1.89) the
# project's toolchain meets; rten 0.25+ needs Rust 1.94. The `onnx` feature
# loads the published .onnx models (the .rten ones are no longer hosted).
ocrs = { version = "=0.12.2", default-features = false, features = ["onnx"] }
rten = { version = "0.24", default-features = false, features = ["onnx_format"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Already in the tree through ureq; encodes captures for vision models.
base64 = "0.23"
# Already in the tree: unpack and check the ffmpeg download (ffmpeg.rs).
flate2 = "1"
sha2 = "0.10"
# Already in the tree through the updater; orders versions in its changelog.
semver = "1"
# Keeps the endpoint API key in the OS credential store: Keychain on macOS,
# Credential Manager on Windows, the Secret Service on Linux. Its default
# `v1` stores are pure Rust there (zbus, as ashpd already uses), so Linux
# builds need no libdbus or OpenSSL packages.
keyring = "4"
# Reads QR codes and 1D/2D barcodes in Capture text (see codes.rs). Without
# its defaults: Grab-it hands it grey pixels itself, so it needs neither its
# own image crate (pinned to an older image release) nor svg, rayon or the
# client-side result parsers.
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "multi_barcode_readers",
    "full_barcode_format_support",
    "encoding_rs",
] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
futures-util = "0.3"
# Already in the tree: the pointer's place and image for recordings on
# X11 (frames.rs). Pure Rust, so no libxcb-xfixes headers are needed.
x11rb = { version = "0.13", features = ["xfixes"] }

[target.'cfg(target_os = "windows")'.dependencies]
# The version xcap uses: draws the pointer into recordings (frames.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The window list in one pass (screen.rs): the same bindings xcap uses.
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
# Recording's own AVCaptureScreenInput session (frames.rs): the same
# bindings xcap uses.
dispatch2 = "0.3"
# `objc2-core-media`: the screen input's minFrameDuration.
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
# Already in the tree: the handler for the microphone prompt
# (permissions.rs).
block2 = "0.6"

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# The microphone for recordings (audio.rs): Core Audio and WASAPI. Linux
# records it through ffmpeg's PulseAudio input instead, so its builds need
# no ALSA headers.
cpal = "0.18"

[dev-dependencies]
tempfile = "3"
# The tests draw the codes they decode; the app itself never writes one.
rxing = { version = "0.9", default-features = false, features = ["encoders"] }

# ocrs is unusably slow unoptimised (see its README), so OCR crates are
# optimised in dev and test builds too.
[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package."rten-base"]
opt-level = 3

[profile.dev.package."rten-gemm"]
opt-level = 3

[profile.dev.package."rten-imageproc"]
opt-level = 3

[profile.dev.package."rten-model-file"]
opt-level = 3

[profile.dev.package."rten-onnx"]
opt-level = 3

[profile.dev.package."rten-shape-inference"]
opt-level = 3

[profile.dev.package."rten-simd"]
opt-level = 3

[profile.dev.package."rten-tensor"]
opt-level = 3

[profile.dev.package."rten-vecmath"]
opt-level = 3

# Screen recording quantises every frame to 256 colours; unoptimised, that
# cannot keep up with the frame rate.
[profile.dev.package.color_quant]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
