name: Report a problem
description: Something in Grab-it doesn't work the way it should.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Grab-it version
      description: Filled in when you use **Send feedback** in the tray menu.
      placeholder: "0.1.0"
  - type: input
    id: os
    attributes:
      label: System
      description: Your operating system and, on Linux, X11 or Wayland.
      placeholder: "Linux x86_64 (Wayland)"
