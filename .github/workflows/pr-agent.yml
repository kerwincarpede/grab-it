name: PR Agent

# AI review (https://docs.pr-agent.ai) when the `ai-review` label is added.
# Re-add the label to review again. Needs the ANTHROPIC_KEY secret.

on:
  pull_request:
    types: [labeled]

concurrency:
  group: pr-agent-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-agent:
    if: github.event.sender.type != 'Bot' && github.event.label.name == 'ai-review'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      # 0.49.0-github_action, pinned by digest.
      - uses: docker://pragent/pr-agent@sha256:b1ed6e8de56eb4d6e4169ee0d5c209bb5ed1ef071a01c0c042c64b80192a785c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_KEY }}
          config.model: anthropic/claude-opus-5-5
          config.fallback_models: '["anthropic/claude-sonnet-5"]'
          # Review only; /describe would rewrite the PR body.
          github_action_config.pr_actions: '["labeled"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"
