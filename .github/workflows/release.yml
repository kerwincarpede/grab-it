name: Release

# Every push to main is released as an Edge pre-release, with the version
# read from the commits. Only copies on the Edge update channel offer it;
# promote.yml makes a chosen Edge build the Stable release. This run is also
# main's CI: ci.yml runs only for pull requests, so each
# merge is checked and built once, and those builds are the release. To force
# a bump instead: Actions → Release → Run workflow, or
#   gh workflow run release.yml -f bump=minor
# A push that changes only docs (the site, docs/ or Markdown) is not
# released; docs.yml publishes the site instead.
on:
  push:
    branches: [main]
    paths-ignore:
      - src/grab-it-docs/**
      - docs/**
      - '**/*.md'
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump. "auto" reads the conventional commits since the last tag.
        type: choice
        options: [auto, patch, minor, major]
        default: auto

# No concurrency group: GitHub keeps only one waiting run per group and
# cancels the rest, which would skip merges that land while a release runs.
# Instead every run waits in its first step for the earlier ones to finish
# (see "Wait for earlier releases"), so each merge is built and released in
# turn and each run sees the tag the previous one published.

permissions:
  contents: read

env:
  # actions/checkout runs `git init`; naming the initial branch keeps git from
  # printing its hint about the default branch name.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Work out the next version from the git tags and open a draft release for
  # it. The draft becomes public, and its tag is created, only once the checks
  # and every installer build pass (see "publish").
  version:
    name: Version
    runs-on: ubuntu-24.04
    # Only main may deploy to this environment, so a branch cannot release.
    environment: release
    # Long enough to queue behind a few releases of about ten minutes each.
    timeout-minutes: 180
    permissions:
      actions: read
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases are made from main, not $GITHUB_REF."
          exit 1

      # Releases go out one at a time, in the order their runs started. Runs
      # are numbered in that order, so wait until no lower-numbered run of
      # this workflow is still queued or running. Checkout comes after, so
      # the tags it fetches include the release the previous run published.
      - name: Wait for earlier releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          while :; do
            earlier=$(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -L 100 \
              --json number,status,url \
              --jq "[.[] | select(.number < $GITHUB_RUN_NUMBER and .status != \"completed\")] | sort_by(.number) | .[].url")
            [ -z "$earlier" ] && break
            echo "Waiting for:"; echo "$earlier"
            sleep 30
          done

      - uses: actions/checkout@v7
        with:
          # The version is computed from the tags and the commits since them.
          fetch-depth: 0

      # Conventional commits drive the "auto" bump: "feat!:" or
      # "BREAKING CHANGE:" is major, "feat:" is minor, anything else is patch.
      - name: Compute the next semantic version
        id: semver
        uses: PaulHatch/semantic-version@v6.0.7
        with:
          tag_prefix: v
          search_commit_body: true

      - name: Choose the release version
        id: next
        env:
          # Empty on a push, which bumps as "auto" does.
          BUMP: ${{ inputs.bump || 'auto' }}
          IS_TAGGED: ${{ steps.semver.outputs.is_tagged }}
          SEMVER: ${{ steps.semver.outputs.version }}
          PREVIOUS: ${{ steps.semver.outputs.previous_version }}
        run: |
          if [ "$IS_TAGGED" = true ]; then
            echo "::error::$GITHUB_SHA is already released; push new commits to main first."
            exit 1
          fi
          if ! git tag -l 'v[0-9]*' | grep -q .; then
            # No release tag yet: the first release takes the app's version.
            version="$(jq -r .version src/grab-it/src-tauri/tauri.conf.json)"
          else
            IFS=. read -r major minor patch <<< "$PREVIOUS"
            case "$BUMP" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
              *) version="$SEMVER" ;;
            esac
          fi
          echo "Releasing v$version ($BUMP bump from v$PREVIOUS)"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open a draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.next.outputs.version }}
          TAG: v${{ steps.next.outputs.version }}
        run: |
          # promote.py drops the "Edge build" paragraph when this release
          # becomes Stable, so keep it on one line.
          body=$(cat <<'BODY'
          **Edge build.** Copies of Grab-it on the Edge update channel (**Settings → General → Updates**) offer this update; Stable copies get it if it is promoted to Stable.

          ## Install

          **macOS and Linux:** install and open it with one command:

          ```sh
          curl -fsSL https://kerwincarpede.github.io/grab-it/install.sh | sh
          ```

          **Homebrew (macOS):**

          ```sh
          brew install --cask kerwincarpede/tap/grab-it
          ```

          Or download the installer for your platform from **Assets** below:

          | Platform | Installer |
          | --- | --- |
          | Windows | `.msi` or `-setup.exe` |
          | macOS (Apple silicon or Intel) | `_universal.dmg` |
          | Linux (x86_64) | `_amd64.AppImage`, `_amd64.deb` or `.x86_64.rpm` |
          | Linux (arm64) | `_aarch64.AppImage`, `_arm64.deb` or `.aarch64.rpm` |

          The installers are not signed with a paid certificate, so Windows SmartScreen and macOS Gatekeeper warn on first launch.

          Already using a Grab-it that has **Check for updates…** in its tray menu? It offers this update itself.

          **macOS:** open the `.dmg`, drag Grab-it to Applications and open it. When macOS says it cannot verify the app, choose **Done**, then go to **System Settings → Privacy & Security** and click **Open Anyway**. Alternatively run `xattr -dr com.apple.quarantine /Applications/Grab-it.app` once.
          BODY
          )

          # Drop drafts an earlier, unfinished run (or an earlier try) left
          # for this tag, then open this run's draft.
          open_draft() {
            drafts=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
              --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id") || return 1
            for draft in $drafts; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$draft" || return 1
            done
            gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$TAG" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="$VERSION" \
              -f body="$body" \
              -F draft=true \
              -F generate_release_notes=true \
              --jq .id
          }

          # The API now and then refuses a call it accepts moments later (a
          # one-off HTTP 403 failed a release after it had queued for nine
          # minutes), so a failure gets two more tries before the run fails.
          for attempt in 1 2 3; do
            if id=$(open_draft) && [ -n "$id" ]; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "::error::Could not open the draft release for $TAG."
              exit 1
            fi
            echo "::warning::Opening the draft release failed (try $attempt of 3); trying again in 20 seconds."
            sleep 20
          done
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  # The same checks and installer builds as every CI run, stamped with the
  # release version and uploading the installers into the draft.
  ci:
    name: CI
    needs: version
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      release_id: ${{ needs.version.outputs.release_id }}
    secrets: inherit

  publish:
    name: Publish release
    needs: [version, ci]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # Installed copies of Grab-it read latest.json from the newest release
      # to find, and verify, the update package for their platform. Written
      # here rather than by each build, so the four builds cannot race to
      # rewrite it.
      - name: Add the updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          mkdir sigs
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name | endswith(".sig")) | "\(.id) \(.name)"' |
            while read -r id name; do
              gh api -H "Accept: application/octet-stream" \
                "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "sigs/$name"
            done
          # The release notes, this release's and recent ones', become the
          # list of changes Grab-it shows before updating.
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > release.json
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > history.json
          python3 .github/scripts/updater_manifest.py \
            --sigs sigs --release release.json --history history.json \
            --download-base "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            > latest.json
          cat latest.json
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=latest.json" \
            > /dev/null

      # Publishing the draft creates its tag on the released commit. It is a
      # pre-release and never the latest release, so Stable copies, which
      # read releases/latest, do not see it.
      - name: Publish the draft as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease=true -f make_latest=false \
            --jq '"Published \(.tag_name): \(.html_url)"'

      # Edge copies read latest.json from the rolling "edge" pre-release.
      # Its tag has no "v", so version numbering ignores it, and latest.json
      # is its only asset. A replaced asset is deleted by id first, since an
      # upload refuses a name already taken.
      - name: Point the edge channel at this release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: |
          if edge=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/edge" --jq .id 2> error.txt); then
            echo "The edge release is $edge."
          elif grep -q "HTTP 404" error.txt; then
            edge=""
          else
            cat error.txt
            exit 1
          fi
          if [ -z "$edge" ]; then
            edge=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name=edge \
              -f target_commitish="$GITHUB_SHA" \
              -f name="Edge" \
              -f body="Edge update channel. Grab-it copies on Edge read latest.json here to find the newest Edge release." \
              -F prerelease=true \
              -f make_latest=false \
              --jq .id)
            echo "Created the edge release ($edge)."
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/$edge/assets" \
            --jq '.[] | select(.name == "latest.json") | .id' |
            while read -r asset; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$asset"
            done
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @latest.json \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$edge/assets?name=latest.json" \
            > /dev/null
          echo "Edge now offers $TAG."
