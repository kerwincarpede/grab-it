name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same checks and builds for a release.
  workflow_call:
    inputs:
      version:
        description: Version stamped into tauri.conf.json before building.
        type: string
        default: ''
      release_id:
        description: Draft release the installers are uploaded to.
        type: string
        default: ''

# A newer push supersedes an older run. Called from release.yml, github.workflow
# is "Release", so a release never shares a group with ordinary CI runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # actions/checkout runs `git init`; naming the initial branch keeps git from
  # printing its hint about the default branch name.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # libx11-dev, libxtst-dev and libxi-dev: rdev's XRecord input hooks, which
  # show clicks and keystrokes in recordings (src-tauri/src/input.rs).
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    libxdo-dev
    libssl-dev
    patchelf
    build-essential
    curl
    wget
    file
    libx11-dev
    libxtst-dev
    libxi-dev
  # xcap: X11 (xcb, randr), Wayland (wayland, EGL, GBM) and PipeWire capture.
  # Its PipeWire bindings (libspa 0.8) need PipeWire 1.0 headers or newer,
  # which Ubuntu 22.04 does not ship; hence the 24.04 runners below.
  XCAP_DEPS: >-
    pkg-config
    libclang-dev
    libxcb1-dev
    libxrandr-dev
    libdbus-1-dev
    libpipewire-0.3-dev
    libwayland-dev
    libegl-dev
    libgbm-dev

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      # The OCR tests download the ocrs models here once; cached below.
      GRAB_IT_OCR_MODELS: ${{ github.workspace }}/.ocr-models
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS $XCAP_DEPS

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
      - run: npm run lint
      - name: Test the release scripts
        working-directory: .
        run: python3 -m unittest discover .github/scripts
      - run: npm test
      # Also produces dist/, which the Rust build embeds.
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Bump the key when the model URLs in src-tauri/src/ocr.rs change.
      - name: Cache the ocrs models
        uses: actions/cache@v6
        with:
          path: .ocr-models
          key: ocrs-models-v1
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS $XCAP_DEPS

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # A release also builds signed update packages (the .app.tar.gz on
      # macOS; the installers themselves elsewhere) for the in-app updater.
      # Other builds skip them, so they need no signing key.
      - name: Stamp the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "app/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            config.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      # macOS keeps privacy permissions (Screen Recording, keychain) by the
      # app's code signature. An ad-hoc signature changes with every build, so
      # every update lost them; the self-signed certificate in the
      # MACOS_CERTIFICATE secret (made by make_macos_signing_cert.sh) keeps
      # the same identity across releases. Tauri's own APPLE_CERTIFICATE
      # import accepts only Apple-issued certificates, so it is imported here
      # and handed to Tauri by name.
      - name: Import the macOS signing certificate
        id: macos-signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [[ -z "$MACOS_CERTIFICATE" ]]; then
            echo "No MACOS_CERTIFICATE secret; the app is signed ad-hoc."
            exit 0
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -f pkcs12 \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/signing.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          # Self-signed, so not "valid" (-v); any identity in this keychain.
          identity=$(security find-identity -p codesigning "$keychain" \
            | sed -n 's/^ *1) [0-9A-F]\{40\} "\(.*\)".*/\1/p')
          if [[ -z "$identity" ]]; then
            security find-identity -p codesigning "$keychain"
            echo "::error::No code-signing identity in MACOS_CERTIFICATE"
            exit 1
          fi
          echo "Signing with \"$identity\""
          echo "identity=$identity" >> "$GITHUB_OUTPUT"

      # The macOS app is signed with the APPLE_SIGNING_IDENTITY secret (a paid
      # certificate already in the keychain) when it is set, then with the
      # MACOS_CERTIFICATE one, and ad-hoc ("-") otherwise. Without any
      # signature, Apple silicon reports a downloaded app as "damaged" and
      # refuses to open it.
      # With a release id (release.yml only) the installers, and the update
      # packages with their .sig files, are also uploaded to the draft
      # release; without one, tauri-action only builds. latest.json is left
      # to release.yml, which writes it once every platform is in.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || steps.macos-signing.outputs.identity || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ inputs.release_id }}
          includeUpdaterJson: false

      # A designated requirement naming a cdhash is the per-build identity
      # that loses permissions on update; a certificate one is stable.
      - name: Check the macOS signature is stable
        if: runner.os == 'macOS' && steps.macos-signing.outputs.identity != ''
        shell: bash
        run: |
          app=app/src-tauri/target/release/bundle/macos/Grab-it.app
          codesign --verify --strict --verbose=2 "$app"
          requirement=$(codesign -d -r- "$app" 2>&1 | sed -n 's/^designated => //p')
          echo "Designated requirement: $requirement"
          if [[ "$requirement" != *certificate* || "$requirement" == *cdhash* ]]; then
            echo "::error::The app's designated requirement is not tied to the certificate"
            exit 1
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: grab-it-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg

