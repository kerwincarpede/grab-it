name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests cancel superseded runs; main queues them, so a release run is
# never cut short and each one sees the tag the previous run published.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    libxdo-dev
    libssl-dev
    patchelf
    build-essential
    curl
    wget
    file
  # xcap: X11 (xcb, randr), Wayland (wayland, EGL, GBM) and PipeWire capture.
  # Its PipeWire bindings (libspa 0.8) need PipeWire 1.0 headers or newer,
  # which Ubuntu 22.04 does not ship; hence the 24.04 runners below.
  XCAP_DEPS: >-
    pkg-config
    libclang-dev
    libxcb1-dev
    libxrandr-dev
    libdbus-1-dev
    libpipewire-0.3-dev
    libwayland-dev
    libegl-dev
    libgbm-dev

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      # The OCR tests download the ocrs models here once; cached below.
      GRAB_IT_OCR_MODELS: ${{ github.workspace }}/.ocr-models
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS $XCAP_DEPS

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Also produces dist/, which the Rust build embeds.
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Bump the key when the model URLs in src-tauri/src/ocr.rs change.
      - name: Cache the ocrs models
        uses: actions/cache@v4
        with:
          path: .ocr-models
          key: ocrs-models-v1
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # On main, work out the next version from the git tags and open a draft
  # release for it. The draft becomes public, and its tag is created, only once
  # the checks and every installer build pass (see "publish").
  version:
    name: Version
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      version: ${{ steps.next.outputs.version }}
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The version is computed from the tags and the commits since them.
          fetch-depth: 0

      # Conventional commits drive the bump: "feat!:" or "BREAKING CHANGE:" is
      # major, "feat:" is minor, anything else is patch.
      - name: Compute the next semantic version
        id: semver
        uses: PaulHatch/semantic-version@v6.0.7
        with:
          tag_prefix: v
          search_commit_body: true

      - name: Choose the release version
        id: next
        env:
          IS_TAGGED: ${{ steps.semver.outputs.is_tagged }}
          SEMVER: ${{ steps.semver.outputs.version }}
        run: |
          if [ "$IS_TAGGED" = true ]; then
            echo "$GITHUB_SHA is already released; skipping."
            exit 0
          fi
          if git tag -l 'v[0-9]*' | grep -q .; then
            version="$SEMVER"
          else
            # No release tag yet: the first release takes the app's version.
            version="$(jq -r .version app/src-tauri/tauri.conf.json)"
          fi
          echo "Releasing v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Open a draft release
        id: draft
        if: steps.next.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.next.outputs.version }}
        run: |
          # Drop drafts an earlier, unfinished run left for this tag.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" |
            while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done

          body=$(cat <<'BODY'
          ## Install

          Download the installer for your platform from **Assets** below:

          | Platform | Installer |
          | --- | --- |
          | Windows | `.msi` or `-setup.exe` |
          | macOS (Apple silicon) | `.dmg` |
          | Linux | `.AppImage`, `.deb` or `.rpm` |

          The installers are unsigned, so Windows SmartScreen and macOS Gatekeeper warn on first launch.
          BODY
          )

          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$GITHUB_SHA" \
            -f name="Grab-it $TAG" \
            -f body="$body" \
            -F draft=true \
            -F generate_release_notes=true \
            --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    # "version" only runs on main; elsewhere it is skipped and the build goes on.
    if: ${{ !cancelled() && !failure() }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS $XCAP_DEPS

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Stamp the release version
        if: needs.version.outputs.version != ''
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "app/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      # With a release id (main only) the installers are also uploaded to the
      # draft release; without one, tauri-action only builds.
      - name: Build unsigned installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          projectPath: app
          releaseId: ${{ needs.version.outputs.release_id }}
          uploadUpdaterJson: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: grab-it-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    name: Publish release
    needs: [checks, version, build]
    if: needs.version.outputs.release_id != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Publishing the draft creates its tag on the released commit.
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.version.outputs.release_id }}
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -f make_latest=true \
            --jq '"Published \(.tag_name): \(.html_url)"'
