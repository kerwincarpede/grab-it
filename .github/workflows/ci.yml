name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # release.yml runs the same checks and builds for a release.
  workflow_call:
    inputs:
      version:
        description: Version stamped into tauri.conf.json before building.
        type: string
        default: ''
      release_id:
        description: Draft release the installers are uploaded to.
        type: string
        default: ''

# A newer push supersedes an older run. Called from release.yml, github.workflow
# is "Release", so a release never shares a group with ordinary CI runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    libxdo-dev
    libssl-dev
    patchelf
    build-essential
    curl
    wget
    file
  # xcap: X11 (xcb, randr), Wayland (wayland, EGL, GBM) and PipeWire capture.
  # Its PipeWire bindings (libspa 0.8) need PipeWire 1.0 headers or newer,
  # which Ubuntu 22.04 does not ship; hence the 24.04 runners below.
  XCAP_DEPS: >-
    pkg-config
    libclang-dev
    libxcb1-dev
    libxrandr-dev
    libdbus-1-dev
    libpipewire-0.3-dev
    libwayland-dev
    libegl-dev
    libgbm-dev

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    env:
      # The OCR tests download the ocrs models here once; cached below.
      GRAB_IT_OCR_MODELS: ${{ github.workspace }}/.ocr-models
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS $XCAP_DEPS

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - run: npm ci
      - run: npm run lint
      - name: Test the release scripts
        working-directory: .
        run: python3 -m unittest discover .github/scripts
      - run: npm test
      # Also produces dist/, which the Rust build embeds.
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Bump the key when the model URLs in src-tauri/src/ocr.rs change.
      - name: Cache the ocrs models
        uses: actions/cache@v4
        with:
          path: .ocr-models
          key: ocrs-models-v1
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build:
    name: Build (${{ matrix.platform }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y $LINUX_DEPS $XCAP_DEPS

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # A release also builds signed update packages (the .app.tar.gz on
      # macOS; the installers themselves elsewhere) for the in-app updater.
      # Other builds skip them, so they need no signing key.
      - name: Stamp the release version
        if: inputs.version != ''
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const file = "app/src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(file, "utf8"));
            config.version = process.env.VERSION;
            config.bundle.createUpdaterArtifacts = true;
            fs.writeFileSync(file, JSON.stringify(config, null, 2) + "\n");
          '

      # The macOS app is signed with the APPLE_SIGNING_IDENTITY secret when it
      # is set, and ad-hoc ("-") otherwise. Without any signature, Apple
      # silicon reports a downloaded app as "damaged" and refuses to open it.
      # With a release id (release.yml only) the installers, and the update
      # packages with their .sig files, are also uploaded to the draft
      # release; without one, tauri-action only builds. latest.json is left
      # to release.yml, which writes it once every platform is in.
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          releaseId: ${{ inputs.release_id }}
          includeUpdaterJson: false

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: grab-it-${{ runner.os }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/rpm/*.rpm
            app/src-tauri/target/release/bundle/appimage/*.AppImage
            app/src-tauri/target/release/bundle/msi/*.msi
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/dmg/*.dmg

