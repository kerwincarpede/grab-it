name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Base commit or ref to time beside the selected head
        required: true
        default: origin/main

# A newer push to a PR cancels the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  CARGO_TERM_COLOR: always
  # Silences git's default-branch hint during checkout.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The base and the head build into one target folder, so they share the
  # compiled dependencies and criterion keeps both runs' results in
  # target/criterion/.
  CARGO_TARGET_DIR: ${{ github.workspace }}/src/grab-it/src-tauri/target
  # The same packages as ci.yml installs.
  LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev
    libayatana-appindicator3-dev
    librsvg2-dev
    libxdo-dev
    libssl-dev
    patchelf
    build-essential
    curl
    wget
    file
    libx11-dev
    libxtst-dev
    libxi-dev
    libasound2-dev
  XCAP_DEPS: >-
    pkg-config
    libclang-dev
    libxcb1-dev
    libxrandr-dev
    libdbus-1-dev
    libpipewire-0.3-dev
    libwayland-dev
    libegl-dev
    libgbm-dev

jobs:
  scope:
    runs-on: ubuntu-24.04
    outputs:
      lint: ${{ steps.paths.outputs.lint }}
      time: ${{ steps.paths.outputs.time }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -z "$BASE" ]]; then
            printf 'lint=true\ntime=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only -z --no-renames "$BASE...$HEAD" > "$RUNNER_TEMP/paths"
          lint=false
          time=false
          shopt -s extglob
          while IFS= read -rd '' path; do
            case "$path" in
              docs/*|src/grab-it-docs/*|*.md) continue ;;
            esac
            lint=true
            case "${path#src/grab-it/}" in
              src-tauri/benches/*|src-tauri/@(Cargo.*|build.rs|.cargo/*|tauri.conf.json)|src-tauri/@(tests/fixtures|fixtures|face-models|ocr-models)/*) time=true ;;
              src-tauri/src/@(capture|codes|editor|faces|ffmpeg|lib|library|ocr|pointer|record|search|settings|storage).rs) time=true ;;
              src/*.bench.ts|src/editor/@(arrowStyles|callout|cut|flatten|model|orient|pointer|render|sidecar|stamps|tools).ts|src/overlay/geometry.ts|src/recording/@(clips|edits|zooms).ts|src/test/*) time=true ;;
              package*.json|vitest*.ts|vite*.ts|tsconfig*.json|.github/workflows/bench.yml|.github/scripts/@(*bench*|install_linux_deps.py)|.cargo/*|*rust-toolchain*|.npmrc) time=true ;;
            esac
          done < "$RUNNER_TEMP/paths"
          printf 'lint=%s\ntime=%s\n' "$lint" "$time" >> "$GITHUB_OUTPUT"

  bench:
    needs: scope
    if: needs.scope.outputs.lint == 'true'
    name: Benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        working-directory: src/grab-it
    steps:
      # The whole history, so the PR's base can be checked out beside it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        working-directory: .
        run: sudo python3 .github/scripts/install_linux_deps.py $LINUX_DEPS $XCAP_DEPS

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Its own cache: the bench profile builds nothing ci.yml's checks do.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/grab-it/src-tauri
          key: bench

      - name: Install dependencies
        working-directory: .
        run: npm ci
      # Produces dist/, which the Rust build embeds.
      - run: npm run build
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --features bench --benches -- -D warnings

      # A base from before the benches existed has nothing to time, and the
      # report then shows the head alone.
      - name: Check out the base
        id: base
        if: needs.scope.outputs.time == 'true'
        working-directory: .
        env:
          BASE_SHA: ${{ inputs.base }}
        run: |
          rm -rf "$CARGO_TARGET_DIR/criterion"
          if [ -z "$BASE_SHA" ]; then
            echo "No PR base; only this commit is timed."
            echo "benches=false" >> "$GITHUB_OUTPUT"
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(git rev-parse --verify --end-of-options "$BASE_SHA^{commit}")
          git worktree add --detach "$RUNNER_TEMP/base" "$sha"
          tauri="$RUNNER_TEMP/base/src/grab-it/src-tauri"
          if grep -q '^bench = ' "$tauri/Cargo.toml" && [ -d "$tauri/benches" ]; then
            echo "benches=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base has no Rust benches; only the head's are timed."
            echo "benches=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -q '"bench":' "$RUNNER_TEMP/base/src/grab-it/package.json"; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "The base has no frontend benches; only the head's are timed."
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

      # The base's results go to each bench's base/ folder. Its new/ folders
      # are removed, so a bench the head drops shows no head numbers.
      - name: Time the base
        id: base-run
        if: steps.base.outputs.benches == 'true'
        continue-on-error: true
        working-directory: .
        run: |
          cd "$RUNNER_TEMP/base"
          npm ci
          cd src/grab-it
          npm run build
          cargo bench --manifest-path src-tauri/Cargo.toml --features bench -- --save-baseline base
          # Only run folders: a new/ that holds benchmark.json itself. sort
          # lets find finish before anything is removed.
          find "$CARGO_TARGET_DIR/criterion" -path '*/new/benchmark.json' -print0 | sort -z |
            while IFS= read -r -d '' run; do
              rm -rf "${run%/benchmark.json}"
            done

      # vitest's JSON reporter writes the base's means for the report to
      # compare the head's with.
      - name: Time the base's frontend
        id: base-frontend
        if: steps.base.outputs.frontend == 'true'
        continue-on-error: true
        working-directory: .
        run: |
          cd "$RUNNER_TEMP/base"
          # The Rust step above installs the base's packages when it runs.
          [ -d node_modules ] || npm ci
          cd src/grab-it
          npm run bench -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-base.json"

      - name: Time the head
        if: needs.scope.outputs.time == 'true'
        env:
          BASE_OK: ${{ steps.base-run.outcome == 'success' }}
        run: |
          if [ "$BASE_OK" = true ]; then
            cargo bench --manifest-path src-tauri/Cargo.toml --features bench -- --baseline-lenient base
          else
            # A base that failed part-way leaves results to compare nothing with.
            # Saved as "head", since criterion otherwise saves them as "base".
            rm -rf "$CARGO_TARGET_DIR/criterion"
            cargo bench --manifest-path src-tauri/Cargo.toml --features bench -- --save-baseline head
          fi

      - name: Time the head's frontend
        if: needs.scope.outputs.time == 'true'
        run: npm run bench -- --reporter=default --reporter=json --outputFile.json="$RUNNER_TEMP/vitest-head.json"

      - name: Collect main measurements
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          baseline="$RUNNER_TEMP/measurements"
          mkdir -p "$baseline/criterion"
          cp "$RUNNER_TEMP/vitest-head.json" "$baseline/vitest.json"
          cd "$CARGO_TARGET_DIR/criterion"
          find . \( -path '*/new/estimates.json' -o -path '*/new/benchmark.json' \) -exec cp --parents -t "$baseline/criterion" {} +

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: measurements-${{ github.sha }}
          path: ${{ runner.temp }}/measurements/
          if-no-files-found: error
          overwrite: true

      - name: Find the successful main push for this base
        id: producer
        if: github.event_name == 'pull_request' && needs.scope.outputs.time == 'true' && github.base_ref == 'main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/bench.yml/runs?event=push&branch=main&head_sha=$BASE&status=success" --jq '.workflow_runs[0].id // empty')
          if [[ -n "$run" ]]; then
            artifact=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/artifacts?name=measurements-$BASE" --jq '.artifacts[0] | if .expired then "expired" else (.id // "missing") end')
            echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
            echo "run=$run" >> "$GITHUB_OUTPUT"
          fi

      - name: Download measurements (JSON only)
        id: baseline
        if: steps.producer.outputs.artifact && steps.producer.outputs.artifact != 'expired' && steps.producer.outputs.artifact != 'missing'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.producer.outputs.run }}
          artifact-ids: ${{ steps.producer.outputs.artifact }}
          merge-multiple: true
          path: ${{ runner.temp }}/main-measurements

      - name: Report
        if: ${{ !cancelled() && needs.scope.outputs.time == 'true' }}
        working-directory: .
        env:
          BASE_OK: ${{ steps.base-run.outcome == 'success' }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          DOWNLOADED: ${{ steps.baseline.outcome == 'success' }}
          STATUS: ${{ steps.producer.outputs.artifact == 'expired' && 'expired' || 'unavailable' }}
          FRONTEND_BASE_OK: ${{ steps.base-frontend.outcome == 'success' }}
        run: |
          flags=(--vitest "$RUNNER_TEMP/vitest-head.json")
          if [[ -n "$PR_BASE" && "$DOWNLOADED" == true ]]; then
            flags+=(--stored-baseline "$RUNNER_TEMP/main-measurements" --baseline-note "Compared with main $PR_BASE on a different runner.")
          elif [[ -n "$PR_BASE" ]]; then
            flags+=(--no-base --baseline-note "Head only: baseline for $PR_BASE is $STATUS.")
          elif [ "$BASE_OK" != true ]; then
            flags+=(--no-base)
          fi
          if [ "$FRONTEND_BASE_OK" = true ]; then
            flags+=(--vitest-base "$RUNNER_TEMP/vitest-base.json")
          fi
          python3 .github/scripts/bench_report.py "$CARGO_TARGET_DIR/criterion" "${flags[@]}"
