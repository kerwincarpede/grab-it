[package]
name = "grab-it"
version = "0.2.0"
description = "Grab-it: screenshot, annotate, record and search your captures"
authors = ["Kerwin Carpede"]
license = "MIT"
edition = "2024"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name,
# see https://github.com/rust-lang/cargo/issues/8519
name = "grab_it_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Smoke-test builds only (npm run e2e): capture reads the PNG named by
# GRAB_IT_E2E_CAPTURE instead of the screen (screen.rs). Shipped builds never
# turn it on.
e2e = []
# Exposes the code the criterion benches in benches/ time (the `bench`
# module in lib.rs). Off by default, so release builds are unchanged.
bench = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
drag = "=2.1.1"
# macos-private-api: the capture overlay is a see-through window.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
xcap = "0.7"
# `jpeg` and `webp`: the Library exports screenshots as JPG and WebP too.
image = { version = "0.25", default-features = false, features = ["png", "gif", "jpeg", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.42", features = ["bundled"] }
# ocrs 0.12 is the newest release on rten 0.24, whose MSRV (1.89) the
# project's toolchain meets; rten 0.25+ needs Rust 1.94. The `onnx` feature
# loads the published .onnx models (the .rten ones are no longer hosted).
ocrs = { version = "=0.12.2", default-features = false, features = ["onnx"] }
rten = { version = "0.24", default-features = false, features = ["onnx_format"] }
# Already in the tree through rten; builds the face detector's input (faces.rs).
rten-tensor = "0.24"
# `platform-verifier` checks certificates against the OS trust store
# (net.rs), so roots installed by IT, such as a TLS-inspecting proxy's,
# are trusted.
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
# Already in the tree through ureq; encodes captures for vision models.
base64 = "0.23"
# Unpack the ffmpeg download (ffmpeg.rs): FFmpeg-Builds packs its Linux
# builds as .tar.xz and its Windows ones as .zip. tar and zip are already in
# the tree through the updater; lzma-rust2 is the pure-Rust xz decoder zip
# uses, so no C library is built.
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "optimization", "xz"] }
sha2 = "0.10"
# Already in the tree through the updater; orders versions in its changelog.
semver = "1"
# Keeps the endpoint API key in the OS credential store: Keychain on macOS,
# Credential Manager on Windows, the Secret Service on Linux. Its default
# `v1` stores are pure Rust there (zbus, as ashpd already uses), so Linux
# builds need no libdbus or OpenSSL packages.
keyring = "4"
# Reads QR codes and 1D/2D barcodes in Capture text (see codes.rs). Without
# its defaults: Grab-it hands it grey pixels itself, so it needs neither its
# own image crate (pinned to an older image release) nor svg, rayon or the
# client-side result parsers.
rxing = { version = "0.9", default-features = false, features = [
    "decoders",
    "multi_barcode_readers",
    "full_barcode_format_support",
    "encoding_rs",
] }
# Free and total space on the save folder's disk, for the Library's
# Storage popover (storage.rs). Pure Rust: rustix on Unix, windows-sys on
# Windows, both already in the tree.
fs4 = "1"
# Moves items cleanup removes to the system Trash (storage.rs): the Recycle
# Bin on Windows, Finder's Trash on macOS, the freedesktop trash on Linux.
trash = "5"
# The control connection the grab-it command line talks to the running app
# over (control.rs): a Unix socket on Linux and macOS, a named pipe on
# Windows.
interprocess = "2"
# Draws the keystroke overlay's label into recordings (frame_overlays.rs), in
# the cut-down DejaVu Sans Bold in fonts/.
ab_glyph = "0.2"
# Global mouse and keyboard events while recording with Show clicks or Show
# keystrokes (input.rs): an event tap on macOS, low-level hooks on Windows,
# XRecord on X11 (libx11, libxtst and libxi headers). Its last release,
# 0.5.3, looks key names up on the tap's own thread, which macOS 14 aborts;
# main sends that to the main thread (`set_is_main_thread`).
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1", default-features = false, features = ["x11"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Already in the tree through wry; Copy as file also uses it to offer the
# file's URI on the GTK clipboard (file_clipboard.rs).
gtk = "0.18"
ashpd = { version = "0.12", default-features = false, features = ["tokio"] }
futures-util = "0.3"
# Already in the tree: the pointer's place and image for recordings on
# X11 (frames.rs). Pure Rust, so no libxcb-xfixes headers are needed.
x11rb = { version = "0.13", features = ["xfixes"] }
# Already in the tree through wry: turns on media streams so the webcam
# bubble and Settings can use the camera (webcam.rs).
webkit2gtk = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
# The version xcap uses: draws the pointer into recordings (frames.rs),
# shows the Open With dialog (library.rs) and puts files on the clipboard
# (file_clipboard.rs).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    # Shows and hides the capture overlay without a fade (freeze.rs).
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    # Attaches the command line to the terminal it was run from (cli.rs).
    "Win32_System_Console",
    "Win32_System_DataExchange",
    # The module a window class is registered under (freeze.rs).
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }
# Already in the tree through interprocess: the control pipe's security
# descriptor string (control.rs).
widestring = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# The window list in one pass (screen.rs): the same bindings xcap uses.
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
# Recording's own AVCaptureScreenInput session (frames.rs): the same
# bindings xcap uses.
dispatch2 = "0.3"
# `objc2-core-media`: the screen input's minFrameDuration.
objc2-av-foundation = { version = "0.3", features = ["objc2-core-media"] }
objc2-core-media = "0.3"
objc2-core-video = "0.3"
# Already in the tree: the handler for the microphone prompt
# (permissions.rs).
block2 = "0.6"
# The system sound on macOS 13+ (audio/system_mac.rs): an audio-only
# ScreenCaptureKit stream, read as Core Audio buffer lists. Linked weakly
# (build.rs) so Grab-it still starts where ScreenCaptureKit is missing.
objc2-screen-capture-kit = { version = "0.3", default-features = false, features = [
    "std",
    "SCShareableContent",
    "SCStream",
    "block2",
    "dispatch2",
    "objc2-core-foundation",
    "objc2-core-media",
] }
objc2-core-audio-types = "0.3"
# Reads the text in captures with the system's own on-device recognition
# (ocr_vision.rs), falling back to ocrs.
objc2-vision = { version = "0.3", default-features = false, features = [
    "std",
    "VNRequest",
    "VNRecognizeTextRequest",
    "VNRequestHandler",
    "VNObservation",
    "VNTypes",
    "objc2-core-graphics",
    "objc2-core-foundation",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
# The microphone for recordings (audio.rs): Core Audio and WASAPI. Linux
# records it through ffmpeg's PulseAudio input instead, so its builds need
# no ALSA headers.
cpal = "0.18"

[dev-dependencies]
# `test`: the IPC tests (ipc_tests.rs) run the real commands on Tauri's
# mock runtime, without a window or display.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
# The tests draw the codes they decode; the app itself never writes one.
rxing = { version = "0.9", default-features = false, features = ["encoders"] }
# The tests pack the .tar.xz builds they download.
lzma-rust2 = { version = "0.25", default-features = false, features = ["std", "encoder", "xz"] }
# The benches in benches/ (`cargo bench --features bench`). Without its
# defaults: the reports are read as JSON, so no plots are drawn.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# Each bench needs the `bench` feature, so `cargo clippy --all-targets` and
# `cargo test` without it skip them.
[[bench]]
name = "detect"
harness = false
required-features = ["bench"]

[[bench]]
name = "encode"
harness = false
required-features = ["bench"]

[[bench]]
name = "library"
harness = false
required-features = ["bench"]

# ocrs is unusably slow unoptimised (see its README), so OCR crates are
# optimised in dev and test builds too.
[profile.dev.package.ocrs]
opt-level = 3

[profile.dev.package.rten]
opt-level = 3

[profile.dev.package."rten-base"]
opt-level = 3

[profile.dev.package."rten-gemm"]
opt-level = 3

[profile.dev.package."rten-imageproc"]
opt-level = 3

[profile.dev.package."rten-model-file"]
opt-level = 3

[profile.dev.package."rten-onnx"]
opt-level = 3

[profile.dev.package."rten-shape-inference"]
opt-level = 3

[profile.dev.package."rten-simd"]
opt-level = 3

[profile.dev.package."rten-tensor"]
opt-level = 3

[profile.dev.package."rten-vecmath"]
opt-level = 3

# Screen recording quantises every frame to 256 colours; unoptimised, that
# cannot keep up with the frame rate.
[profile.dev.package.color_quant]
opt-level = 3

[profile.dev.package.gif]
opt-level = 3

[profile.dev.package.image]
opt-level = 3

# Benches compare a PR with its base rather than time the shipped app, so
# they skip the release profile's slow link-time optimisation.
[profile.bench]
lto = false
codegen-units = 16

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
